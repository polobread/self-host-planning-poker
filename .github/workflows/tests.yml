name: Tests

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  backend-tests:
    name: Back-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: flask/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r flask/requirements.txt
      - name: Run tests
        working-directory: flask
        run: python -m unittest discover -s test -v
  frontend-checks:
    name: Front-end tests, typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: angular/.nvmrc
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - name: Set up npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:ci
      - name: Check types, lint and build
        run: npm run typecheck && npm run lint && npm run build
